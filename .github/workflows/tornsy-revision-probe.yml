name: Tornsy revision probe

on:
  push:
    branches:
      - stage-0-tornsy-revision-probe
    paths:
      - "research/tools/tornsy_revision_probe.py"
      - "research/tools/torn_research.py"
      - "research/tornsy_revision_windows.json"
      - "research/evidence/tornsy_revision_baseline.json"
      - "tests/**"
      - ".github/workflows/tornsy-revision-probe.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

# TEMPORARY bootstrap permission. This is removed immediately after the exact
# generated baseline is committed by the workflow on the research branch.
permissions:
  contents: write

concurrency:
  group: tornsy-revision-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Probe fixed historical windows
        shell: bash
        run: |
          set -o pipefail
          baseline_args=()
          if [[ -f research/evidence/tornsy_revision_baseline.json ]]; then
            baseline_args=(--baseline research/evidence/tornsy_revision_baseline.json)
          fi
          python research/tools/tornsy_revision_probe.py \
            --config research/tornsy_revision_windows.json \
            "${baseline_args[@]}" \
            --output data/raw \
            --run-id "${GITHUB_RUN_ID}" \
            --limit 2000 \
            --delay 0.25 | tee tornsy-revision-probe.log

      - name: Bootstrap exact baseline once
        if: github.ref == 'refs/heads/stage-0-tornsy-revision-probe'
        shell: bash
        run: |
          if [[ -f research/evidence/tornsy_revision_baseline.json ]]; then
            echo 'Baseline already committed; bootstrap write not needed.'
            exit 0
          fi
          candidate=$(find data/raw/tornsy/revision_probe -name candidate_baseline.json -type f | head -n 1)
          test -n "$candidate"
          mkdir -p research/evidence
          cp "$candidate" research/evidence/tornsy_revision_baseline.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/evidence/tornsy_revision_baseline.json
          git commit -m 'research: bootstrap Tornsy revision baseline'
          git push origin HEAD:stage-0-tornsy-revision-probe

      - name: Add revision summary
        if: always()
        shell: bash
        run: |
          comparison=$(find data/raw/tornsy/revision_probe -name comparison.json -type f 2>/dev/null | head -n 1 || true)
          candidate=$(find data/raw/tornsy/revision_probe -name candidate_baseline.json -type f 2>/dev/null | head -n 1 || true)
          echo '## Tornsy fixed-window revision probe' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$comparison" ]]; then
            echo '### Baseline comparison' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$comparison" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$candidate" ]]; then
            echo 'No committed baseline existed at checkout; candidate baseline generated.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Probe did not generate comparison or baseline evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tornsy-revision-probe-${{ github.run_id }}
          path: |
            data/raw/tornsy/revision_probe/**
            tornsy-revision-probe.log
          if-no-files-found: error
          retention-days: 90
