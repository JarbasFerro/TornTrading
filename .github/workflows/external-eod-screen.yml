name: External EOD candidate screen

on:
  workflow_dispatch:
    inputs:
      batch_index:
        description: "0-based candidate batch index"
        required: true
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: external-eod-candidate-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require Tiingo token
        shell: bash
        run: |
          if [[ -z "${TIINGO_TOKEN:-}" ]]; then
            echo "::error::Configure the TIINGO_TOKEN Actions secret before running this research screen."
            exit 1
          fi
          echo "TIINGO_TOKEN is configured. Its value is never printed or passed on the command line."

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run transient EOD screen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf research/output/external_eod_screen
          python research/tools/run_external_eod_screen.py \
            --batch-index "${{ inputs.batch_index }}" \
            --batch-size 35 \
            --output research/output/external_eod_screen

      - name: Enforce artifact allowlist
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            research/output/external_eod_screen/candidate_statistics.csv \
            research/output/external_eod_screen/errors.csv \
            research/output/external_eod_screen/external_coverage.csv \
            research/output/external_eod_screen/summary.json | sort)
          actual=$(find research/output/external_eod_screen -type f | sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Unexpected persisted file detected in external EOD output."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          fi
          if grep -R -E '"(price|close|adjClose|returns|series|observations|raw_rows)"[[:space:]]*:' research/output/external_eod_screen; then
            echo "::error::Potential reconstructable external series field detected."
            exit 1
          fi

      - name: Add research summary
        shell: bash
        run: |
          echo '## External EOD candidate screen' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only aggregate/non-reconstructable outputs are persisted.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat research/output/external_eod_screen/summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate screening results
        uses: actions/upload-artifact@v4
        with:
          name: external-eod-screen-batch-${{ inputs.batch_index }}-${{ github.run_id }}
          path: |
            research/output/external_eod_screen/candidate_statistics.csv
            research/output/external_eod_screen/errors.csv
            research/output/external_eod_screen/external_coverage.csv
            research/output/external_eod_screen/summary.json
          if-no-files-found: error
          retention-days: 90
