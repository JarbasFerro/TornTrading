name: Tornsy public audit

on:
  push:
    branches:
      - stage-0-tornsy-public-audit
    paths:
      - "research/tools/run_tornsy_matrix.py"
      - "research/tools/torn_research.py"
      - "tests/**"
      - ".github/workflows/tornsy-public-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tornsy-public-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run bounded Tornsy matrix
        shell: bash
        run: |
          set -o pipefail
          python research/tools/run_tornsy_matrix.py \
            --output data/raw \
            --intervals m1 h1 d1 \
            --limit 2000 \
            --delay 0.5 \
            --attempts 3 | tee tornsy-audit.log

      - name: Add audit summary
        if: always()
        shell: bash
        run: |
          summary=$(find data/raw/tornsy/matrix -name summary.json -type f 2>/dev/null | sort | tail -n 1 || true)
          if [[ -n "$summary" ]]; then
            echo '## Tornsy bounded public audit' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No audit summary was generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload raw audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tornsy-public-audit-${{ github.run_id }}
          path: |
            data/raw/tornsy/matrix/**
            tornsy-audit.log
          if-no-files-found: error
          retention-days: 90
